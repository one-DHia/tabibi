<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabibi — Réservation Médicale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/booking/style.css">
</head>
<body>
  <div class="clinical-container">
    
    <!-- Language Switcher -->
    <div class="lang-selector">
      <button class="lang-btn active" data-lang="fr">FR</button>
      <button class="lang-btn" data-lang="ar">عربي</button>
      <button class="lang-btn" data-lang="en">EN</button>
    </div>

    <!-- Cabinet Profile -->
    <header class="cabinet-header">
      <div class="cabinet-avatar">🏥</div>
      <div class="cabinet-info">
        <h1 id="cabinetName">Cabinet Médical</h1>
        <div class="cabinet-specialty" id="cabinetSpecialty">✦ Spécialité Médicale</div>
        <div class="cabinet-meta">
          <span id="cabinetAddress">📍 Alger</span>
          <span id="cabinetPhone">📞 0550 00 00 00</span>
        </div>
      </div>
    </header>

    <!-- Main Booking Form Card -->
    <main class="clinical-card" id="bookingCard">
      <!-- 1. Date selection -->
      <section class="form-group">
        <label class="section-title" data-i18n="booking.select_date">1. Choisissez une date</label>
        <input type="date" id="appointmentDate" class="form-input" />
      </section>

      <!-- 2. Slot Selection -->
      <section class="form-group">
        <label class="section-title" data-i18n="booking.select_time">2. Choisissez une heure</label>
        <div id="lockBanner" class="lock-banner" data-i18n="booking.slot_locked_by_you">
          Créneau réservé pour vous (valable 15 min)
        </div>
        <div id="slotsContainer" class="slots-grid">
          <!-- Dynamically populated -->
        </div>
      </section>

      <!-- 3. Patient Information -->
      <section class="form-group" style="margin-top: 32px;">
        <label class="section-title" data-i18n="booking.form_title">3. Vos coordonnées</label>
        
        <div class="form-group">
          <label class="form-label" data-i18n="booking.name_label">Nom et Prénom</label>
          <input type="text" id="patientName" class="form-input" placeholder="ex: Mohamed Benali" required />
        </div>

        <div class="form-group">
          <label class="form-label" data-i18n="booking.whatsapp_label">Numéro WhatsApp</label>
          <input type="tel" id="patientWhatsapp" class="form-input" placeholder="05 XX XX XX XX" required />
          <div class="whatsapp-badge">
            <span>💬</span>
            <span data-i18n="booking.whatsapp_notice">Obligatoire : votre confirmation sera envoyée par WhatsApp.</span>
          </div>
        </div>

        <button type="button" id="submitBooking" class="btn-primary" data-i18n="booking.submit_button" disabled>
          Confirmer le rendez-vous
        </button>
      </section>
    </main>

    <!-- Success Confirmation Card -->
    <section class="clinical-card" id="successCard" style="display: none;">
      <div class="success-check-circle">✓</div>
      <h2 style="font-size: 22px; font-weight: 800; margin-bottom: 8px;" data-i18n="booking.success_title">
        Rendez-vous Confirmé
      </h2>
      <p style="color: var(--text-secondary); margin-bottom: 24px;" data-i18n="booking.success_message">
        Un message récapitulatif vous a été envoyé sur WhatsApp.
      </p>
      <div id="confirmedDetails" style="background: rgba(16, 185, 129, 0.06); border: 1px solid rgba(16, 185, 129, 0.2); padding: 20px; border-radius: var(--radius-md); font-size: 15px; text-align: left; line-height: 1.8;">
      </div>
    </section>

  </div>

  <script type="module" src="/booking/booking.js"></script>
</body>
</html>
